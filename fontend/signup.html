<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Sign Up</title>
    <!-- Tailwind CSS link styling ke liye -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Main Container Card -->
    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
        
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-indigo-500">Create Account</h2>
            <p class="text-slate-400 text-sm mt-1">Sign up to get your personalized learning roadmap</p>
        </div>

        <!-- 👇 Ye raha aapka Signup Form 👇 -->
        <form action="http://127.0.0.1:8000/api/auth/signup" method="POST"></form>
            
            <!-- Full Name Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Full Name</label>
                <input type="text" name="name" required placeholder="Enter your name" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <!-- Email Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required placeholder="name@example.com" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-2">
                Sign Up
            </button>
            
        </form>

        <!-- Back to Login Link -->
        <div class="text-center mt-6">
            <p class="text-slate-400 text-sm">
                Already have an account? 
                <a href="index.html" class="text-indigo-400 hover:underline">Log In</a>
            </p>
        </div>

    </div>

</body>
</html>
