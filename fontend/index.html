<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSync - Sign Up & Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center bg-gradient-to-tr from-cyan-500 to-violet-600 p-3.5 rounded-2xl shadow-lg shadow-cyan-500/20 mb-3">
                <i class="fa-solid fa-rocket text-2xl text-white"></i>
            </div>
            <h1 class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-teal-300 to-violet-400 bg-clip-text text-transparent">SkillSync</h1>
            <p class="text-slate-400 text-xs mt-1 font-medium">Intelligent Career Mentor & Learning Analytics Engine</p>
        </div>

        <!-- Auth Card -->
        <div class="bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl">
            
            <!-- Tab Switcher -->
            <div class="flex border-b border-slate-800 mb-6 text-sm font-bold">
                <button id="signupTabBtn" onclick="switchAuthTab('signup')" class="flex-1 pb-3 text-cyan-400 border-b-2 border-cyan-400 transition">Sign Up</button>
                <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-slate-500 hover:text-slate-300 border-b-2 border-transparent transition">Login</button>
            </div>

            <!-- Alert Box -->
            <div id="authAlert" class="hidden p-3 rounded-xl text-xs font-semibold mb-4 text-center"></div>

            <!-- Signup Form -->
            <form id="signupForm" onsubmit="handleAuthSubmit(event, 'signup')" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Full Name</label>
                    <input type="text" id="signupName" required placeholder="Enter full name" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="student@example.com" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="signupPassword" required placeholder="••••••••" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-violet-600 hover:from-cyan-400 hover:to-violet-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 active:scale-[0.99]">
                    Register Account
                </button>
            </form>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="student@example.com" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-cyan-500 to-violet-600 hover:from-cyan-400 hover:to-violet-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-cyan-500/20 active:scale-[0.99]">
                    Log In
                </button>
            </form>

        </div>
    </div>

    <script>
        function switchAuthTab(type) {
            const signupForm = document.getElementById('signupForm');
            const loginForm = document.getElementById('loginForm');
            const signupBtn = document.getElementById('signupTabBtn');
            const loginBtn = document.getElementById('loginTabBtn');
            const alertBox = document.getElementById('authAlert');

            alertBox.classList.add('hidden');

            if (type === 'signup') {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupBtn.className = "flex-1 pb-3 text-cyan-400 border-b-2 border-cyan-400 transition";
                loginBtn.className = "flex-1 pb-3 text-slate-500 hover:text-slate-300 border-b-2 border-transparent transition";
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                signupBtn.className = "flex-1 pb-3 text-slate-500 hover:text-slate-300 border-b-2 border-transparent transition";
                loginBtn.className = "flex-1 pb-3 text-cyan-400 border-b-2 border-cyan-400 transition";
            }
        }

        async function handleAuthSubmit(event, type) {
            event.preventDefault();
            const alertBox = document.getElementById('authAlert');
            alertBox.classList.add('hidden');

            let endpoint = type === 'signup' ? 'http://127.0.0.1:8000/api/auth/signup' : 'http://127.0.0.1:8000/api/auth/login';
            let payload = {};

            if (type === 'signup') {
                payload = {
                    name: document.getElementById('signupName').value,
                    email: document.getElementById('signupEmail').value,
                    password: document.getElementById('signupPassword').value
                };
            } else {
                payload = {
                    email: document.getElementById('loginEmail').value,
                    password: document.getElementById('loginPassword').value
                };
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    alertBox.className = "p-3 rounded-xl text-xs font-semibold mb-4 text-center bg-rose-500/10 text-rose-400 border border-rose-500/20";
                    alertBox.innerText = data.detail || "Authentication Failed!";
                    alertBox.classList.remove('hidden');
                    return;
                }

                if (type === 'signup') {
                    localStorage.setItem('student_id', data.id);
                    localStorage.setItem('student_name', data.name);
                    window.location.href = "quiz.html";
                } else {
                    localStorage.setItem('student_id', data.user.id);
                    localStorage.setItem('student_name', data.user.name);
                    window.location.href = "dashboard.html";
                }

            } catch (err) {
                alertBox.className = "p-3 rounded-xl text-xs font-semibold mb-4 text-center bg-rose-500/10 text-rose-400 border border-rose-500/20";
                alertBox.innerText = "Backend server offline! Make sure uvicorn is running.";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
